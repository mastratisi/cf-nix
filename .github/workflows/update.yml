name: update

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Read the npm release feed
        run: nix develop --command ./update.sh

      - name: Stop here if nothing changed
        id: diff
        run: |
          if git diff --quiet -- release.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(jq -r .version release.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and smoke-test
        if: steps.diff.outputs.changed == 'true'
        run: |
          nix build --print-build-logs
          test "$(./result/bin/cf --version)" = "${{ steps.diff.outputs.version }}"

      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release.json package-lock.json
          git commit -m "cf ${{ steps.diff.outputs.version }}"
          git tag "v${{ steps.diff.outputs.version }}"
          git push --atomic origin HEAD "v${{ steps.diff.outputs.version }}"
